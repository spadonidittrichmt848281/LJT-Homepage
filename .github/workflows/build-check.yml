name: Build site check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Inspect rendered site
        run: |
          find _site -type f | sort
          python3 - <<'PY'
          from html.parser import HTMLParser

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style'):
                      self.skip += 1
                  if tag in ('p', 'div', 'li', 'h1', 'h2', 'h3', 'h4', 'br', 'article', 'a'):
                      self.parts.append('\n')

              def handle_endtag(self, tag):
                  if tag in ('script', 'style') and self.skip:
                      self.skip -= 1

              def handle_data(self, data):
                  if not self.skip and data.strip():
                      self.parts.append(data.strip() + ' ')

          for page in ('_site/index.html', '_site/publications/index.html'):
              print('\n===== RENDERED PAGE: ' + page + ' =====')
              parser = Text()
              parser.feed(open(page, encoding='utf-8').read())
              print(''.join(parser.parts))
          PY